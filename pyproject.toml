[project]
name = "printsect"
version = "0.1.0"
description = "Let an AI agent narrow down a C bug by inserting print probes, running, and reading the console"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
psect = "printsect.cli:main"
psect-deps = "printsect.deps.cli:main"
psect-probe = "printsect.probe.cli:main"
psect-deploy = "printsect.deploy.cli:main"
psect-console = "printsect.console.cli:main"
psect-map = "printsect.map.cli:main"
psect-knowledge = "printsect.knowledge.cli:main"

[project.optional-dependencies]
# The serial console opens a COM port itself; not needed when another program holds it.
serial = ["pyserial>=3.5"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyftpdlib>=2.2.0",
    "pyserial>=3.5",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyserial>=3.5.0.20261104",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printsect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
