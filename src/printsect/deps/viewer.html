<script>
"use strict";
// Sized for large projects (thousands of sources, about a million header uses):
// lookups are indexed and remembered, folded branches are built only when opened,
// and one drawing is held to a row budget.
const D = JSON.parse(document.getElementById("data").textContent);
const P = D.paths;
const at = (i) => P[i];
const outs = {}, archives = {}, objects = {};
for (const [o, objs, archs, libs] of D.outs) {
  outs[P[o]] = { objects: objs.map(at), archives: archs.map(at), libs };
}
for (const [a, objs] of D.archives) archives[P[a]] = { objects: objs.map(at) };
for (const [o, src, dirs, hs] of D.objects) {
  objects[P[o]] = { source: src < 0 ? null : P[src], include_dirs: dirs.map(at), headers: hs.map(at) };
}

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;

const base = (p) => p.slice(p.lastIndexOf("/") + 1);
const push = (map, key, value) => {
  const list = map.get(key);
  if (list) list.push(value); else map.set(key, [value]);
};
const ROW_BUDGET = 3000;  // rows drawn at once before branches start folded
const LIST_MAX = 300;     // items shown in one list on the right

// ---- graph -------------------------------------------------------------------
const kindOf = (p) => p in outs ? "out" : p in archives ? "archive"
  : p in objects ? "object" : null;
const childrenOf = (p) => outs[p] ? [...outs[p].objects, ...outs[p].archives]
  : archives[p] ? archives[p].objects : [];
const parents = new Map();
for (const c of [...Object.keys(outs), ...Object.keys(archives)]) {
  for (const ch of childrenOf(c)) {
    const list = parents.get(ch);
    if (!list) parents.set(ch, [c]); else if (!list.includes(c)) list.push(c);
  }
}
const roots = [...Object.keys(outs), ...Object.keys(archives)]
  .filter((p) => !parents.has(p)).sort();
const finals = roots.filter((p) => p in outs);
const users = new Map();        // source or header -> objects built from it
const headerUsers = new Map();  // header -> objects that read it
for (const [o, info] of Object.entries(objects)) {
  if (info.source) push(users, info.source, o);
  for (const h of info.headers) { push(users, h, o); push(headerUsers, h, o); }
}
const probesOf = (f) => (f && D.probes[f]) || [];
const statusMap = new Map(D.status.map(([p, s]) => [P[p], s]));
const excludedWhy = new Map(D.excluded.map(([p, why]) => [P[p], why]));
const madeOf = new Map(D.made.map(([g, from, by]) => [P[g], { from: from.map(at), by: by < 0 ? null : P[by] }]));
const copiesOf = new Map(D.copies.map(([target, source]) => [target, P[source]]));
const deployedFrom = new Map();
for (const [target, source] of copiesOf) push(deployedFrom, source, target);
const labels = new Map((D.labels || []).map(([p, name, origin]) => [P[p], { name, origin }]));
const sourceFiles = new Set(Object.values(objects).map((o) => o.source).filter(Boolean));
const inputsOf = new Set();
for (const info of madeOf.values()) { info.from.forEach((x) => inputsOf.add(x)); if (info.by) inputsOf.add(info.by); }
const kindAny = (p) => kindOf(p) || (madeOf.has(p) ? "made" : headerUsers.has(p) ? "header"
  : copiesOf.has(p) ? "deploy" : inputsOf.has(p) ? "input" : sourceFiles.has(p) ? "source" : null);
function statusOf(p) {
  if (excludedWhy.has(p)) return "excluded";
  if (statusMap.has(p)) return statusMap.get(p);
  return headerUsers.has(p) && D.default_status === "build" ? "inferred" : D.default_status;
}
function impactOf(path) {
  const reached = new Set(), made = [];
  const files = [path], seen = new Set([path]);
  while (files.length) {
    const f = files.pop();
    for (const s of startsOf(f)) reached.add(s);
    for (const [g, info] of madeOf) {
      if ((info.from.includes(f) || info.by === f) && !seen.has(g)) { seen.add(g); made.push(g); files.push(g); }
    }
  }
  const stack = [...reached];
  while (stack.length) for (const p of parents.get(stack.pop()) || []) {
    if (!reached.has(p)) { reached.add(p); stack.push(p); }
  }
  reached.delete(path);
  const some = (table) => [...reached].filter((p) => p in table).sort();
  const deployed = [...copiesOf].filter(([, s]) => reached.has(s) || seen.has(s)).map(([t]) => t).sort();

}

const rootsMemo = new Map();
function rootsOf(node) {
  if (rootsMemo.has(node)) return rootsMemo.get(node);
  const found = new Set();
  const stack = [node], seen = new Set([node]);
  while (stack.length) {
    const cur = stack.pop();
    const up = parents.get(cur) || [];
    if (!up.length) found.add(cur);
    for (const p of up) {
      if (rootsMemo.has(p)) rootsMemo.get(p).forEach((r) => found.add(r));
      else if (!seen.has(p)) { seen.add(p); stack.push(p); }
    }
  }
  rootsMemo.set(node, found);
  return found;
}
const startsOf = (file) => (kindOf(file) ? [file] : []).concat(users.get(file) || []);
function rootsForFile(file) {
  const out = new Set();
  for (const s of startsOf(file)) rootsOf(s).forEach((r) => out.add(r));
  return [...out].sort();
}
function chainsFor(file, limit) {
  const out = [];
  const walk = (node, path) => {
    if (out.length >= limit) return;
    const up = (parents.get(node) || []).filter((p) => !path.includes(p));
    if (!up.length) { out.push(path); return; }
    for (const p of up) walk(p, [...path, p]);
  };
  for (const s of startsOf(file)) { if (out.length >= limit) break; walk(s, [s]); }
  return out;
}

// ---- search ------------------------------------------------------------------
function makeMatcher(q, regex) {
  if (!q) return null;
  if (regex) {
    const rx = new RegExp(q, "i");  // throws on a bad pattern
    return { test: (s) => !!s && rx.test(s), spans: (s) => spansOf(s, new RegExp(q, "gi")) };
  }
  if (/[*?[]/.test(q)) {
    const src = "^" + q.replace(/[.+^${}()|\\]/g, "\\$&")
      .replace(/\*/g, ".*").replace(/\?/g, ".") + "$";
    const rx = new RegExp(src, "i");
    const test = (s) => !!s && (rx.test(s) || rx.test(base(s)));
    return {
      test,
      spans: (s) => {
        const out = [];
        let pos = 0;
        for (const w of s.split(" ")) {
          if (test(w)) out.push([pos, pos + w.length]);
          pos += w.length + 1;
        }
        return out;
      },
    };
  }
  const low = q.toLowerCase();
  return {
    test: (s) => !!s && s.toLowerCase().includes(low),
    spans: (s) => {
      const out = [];
      const l = s.toLowerCase();
      for (let i = l.indexOf(low); i >= 0; i = l.indexOf(low, i + low.length)) {
        out.push([i, i + low.length]);
      }
      return out;
    },
  };
}
function spansOf(s, rx) {
  const out = [];
  for (const m of s.matchAll(rx)) if (m[0].length) out.push([m.index, m.index + m[0].length]);
  return out;
}

// ---- state -------------------------------------------------------------------
const state = {
  view: "tree", q: "", regex: false, folders: true, sources: false, headers: false, probed: false,
  selected: null, opened: new Set(), closed: new Set(), fold: "auto",  // auto | all | none
  theme: "auto", gdir: "all", gdepth: 0, glayout: "lr", gunres: false,
  ggroup: D.map && D.map.by_archive ? "by_archive" : "modules",
  gkinds: new Set(["out", "archive", "object", "made", "input", "deploy"]), pins: [],
};
const KEPT = ["view", "regex", "folders", "sources", "headers", "probed", "theme", "glayout"];
const OPEN_KEY = "psect-deps-open:" + D.name;
const OPEN_MAX = 2000;  // branches remembered between visits
try {
  const open = JSON.parse(localStorage.getItem(OPEN_KEY) || "{}");
  for (const k of open.opened || []) state.opened.add(k);
  for (const k of open.closed || []) state.closed.add(k);
} catch (e) { /* storage may be blocked */ }
function rememberOpen() {
  try {
    localStorage.setItem(OPEN_KEY, JSON.stringify({ opened: [...state.opened].slice(-OPEN_MAX),
      closed: [...state.closed].slice(-OPEN_MAX) }));
  } catch (e) { /* storage may be blocked */ }
}
try {
  const saved = JSON.parse(localStorage.getItem("psect-deps") || "{}");
  for (const k of KEPT) if (k in saved) state[k] = saved[k];
} catch (e) { /* storage may be blocked */ }
function remember() {
  try {
    localStorage.setItem("psect-deps", JSON.stringify(Object.fromEntries(KEPT.map((k) => [k, state[k]]))));
  } catch (e) { /* storage may be blocked */ }

  Object.keys(objects).length + " objects", headerUsers.size + " headers",
  "made " + (D.generated || "?") + " from " + (D.command || "?"),
].join(" · ");
if (D.headers_traced === false) {
  const s = el("div", "warn", "Headers are not followed (deps.headers: false), so this "
    + "shows sources only and cannot say what a header change rebuilds.");
  $("stale").before(s);
}
if (D.stale.length) {
  const s = $("stale");
  s.hidden = false;
  s.textContent = "Changed since this was made: " + D.stale.slice(0, 5).join(", ")
    + (D.stale.length > 5 ? " …" : "") + ". Run psect deps html again for a fresh view.";
}
for (const [id, key] of [["o-regex", "regex"], ["o-folders", "folders"], ["o-sources", "sources"],
  ["o-headers", "headers"], ["o-probed", "probed"]]) {
  const box = $(id);
  box.checked = state[key];
  box.addEventListener("change", () => { state[key] = box.checked; remember(); render(); });
}
let timer = 0;
$("q").addEventListener("input", (ev) => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    state.q = ev.target.value;
    state.opened.clear(); state.closed.clear(); state.fold = "auto";
    render();
  }, 150);
});
$("tab-tree").addEventListener("click", () => { state.view = "tree"; remember(); render(); });
for (const v of ["headers", "graph", "modules", "status"]) {
  $("tab-" + v).addEventListener("click", () => { state.view = v; remember(); render(); });
}
const graphInput = (id, set) => $(id).addEventListener("change", (ev) => { set(ev.target); render(); });
graphInput("g-dir", (t) => { state.gdir = t.value; });
graphInput("g-depth", (t) => { state.gdepth = Math.max(0, Number(t.value) || 0); });
graphInput("g-unres", (t) => { state.gunres = t.checked; });
graphInput("g-layout", (t) => { state.glayout = t.value; remember(); });
graphInput("g-stage", (t) => {
  if (t.value) state.gkinds = new Set(t.value.split(","));
  syncControls();
});
document.querySelectorAll("#g-kinds input").forEach((box) => box.addEventListener("change", () => {
  if (box.checked) state.gkinds.add(box.value); else state.gkinds.delete(box.value);
  $("g-stage").value = "";
  render();
}));
$("zin").addEventListener("click", () => zoom(1.25));
$("zout").addEventListener("click", () => zoom(0.8));
$("zfit").addEventListener("click", fit);
$("xjson").addEventListener("click", exportJson);
$("xsvg").addEventListener("click", exportSvg);
$("xpng").addEventListener("click", exportPng);
$("prev").addEventListener("click", () => stepHit(-1));
$("next").addEventListener("click", () => stepHit(1));
const VIEWS_KEY = "psect-deps-views:" + D.name;
function savedViews() {
  try { return JSON.parse(localStorage.getItem(VIEWS_KEY) || "{}"); } catch (e) { return {}; }
}
function listViews() {
  const box = $("views");
  box.replaceChildren(el("option", "", "-"));
  box.firstChild.value = "";
  for (const name of Object.keys(savedViews()).sort()) { const o = el("option", "", name); o.value = name; box.append(o); }
}
$("save").addEventListener("click", () => {
  const name = window.prompt("Name of this view");
  if (!name) return;
  const views = savedViews();
  views[name] = location.hash;
  try { localStorage.setItem(VIEWS_KEY, JSON.stringify(views)); } catch (e) { /* blocked */ }
  listViews();
});
$("views").addEventListener("change", (ev) => {
  const hash = savedViews()[ev.target.value];
  if (hash !== undefined) { location.hash = hash; readHash(); render(); }
});
listViews();
syncControls();
// Up and Down walk the rows on screen, Right opens, Left closes, Enter picks.
$("left").addEventListener("keydown", (ev) => {
  if (state.view !== "tree" || !ev.target.closest) return;
  const rows = [...document.querySelectorAll("#left .row")].filter((r) => r.offsetParent);
  const now = ev.target.closest(".row");
  const i = rows.indexOf(now);
  const toggle = (open) => {
    const li = now && now.parentElement;
    if (li && li.classList.contains("closed") === open) now.querySelector(".tw").click();
  };
  if (ev.key === "ArrowDown") rows[Math.min(i + 1, rows.length - 1)].focus();
  else if (ev.key === "ArrowUp") rows[Math.max(i - 1, 0)].focus();
  else if (ev.key === "ArrowRight") toggle(true);
  else if (ev.key === "ArrowLeft") toggle(false);
  else if (ev.key === "Enter" && now) now.click();
  else return;
  ev.preventDefault();
});
$("expand").addEventListener("click", () => {
  state.opened.clear(); state.closed.clear(); state.fold = "all"; render();
});
$("collapse").addEventListener("click", () => {
  state.opened.clear(); state.closed.clear(); state.fold = "none"; render();
});
document.addEventListener("keydown", (ev) => {
  const q = $("q");
  if (ev.key === "/" && document.activeElement !== q) { ev.preventDefault(); q.focus(); q.select(); }
  else if (ev.key === "Escape" && document.activeElement === q) {
    q.value = ""; state.q = ""; render();
  }
});
readHash();
render();
</script>
</body>
</html>
