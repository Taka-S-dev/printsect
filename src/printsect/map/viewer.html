<script>
"use strict";
// The page only ever puts what it was given on the screen as text.
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const push = (map, key, value) => {
  const list = map.get(key);
  if (list) list.push(value); else map.set(key, [value]);
};
const LIST_MAX = 300;
const ROLE_TAG = { start: "START", core: "CORE", base: "BASE", middle: "MID", isolated: "ALONE" };
const TABS = [["start", "Start here"], ["map", "Map"], ["modules", "Modules"], ["problems", "Problems"],
  ["unresolved", "Unresolved"], ["changes", "Changes"]];

const S = { tab: "start", group: D.default, hidden: new Set(), min: 1, dir: "all", depth: 0, layout: "lr",
  pick: null, trace: null, sort: "in", theme: "auto" };
try {
  const saved = JSON.parse(localStorage.getItem("psect-map") || "{}");
  if (["auto", "light", "dark", "contrast"].includes(saved.theme)) S.theme = saved.theme;
  if (saved.layout === "tb") S.layout = "tb";
} catch (e) { /* storage may be blocked */ }
function remember() {
  try { localStorage.setItem("psect-map", JSON.stringify({ theme: S.theme, layout: S.layout })); }
  catch (e) { /* storage may be blocked */ }
}

// ---- what the data says -------------------------------------------------------
const fileNo = new Map(D.files.map((f, i) => [f, i]));
const defsOf = new Map(), defsIn = new Map(), usesOut = new Map(), usesIn = new Map(), usersOf = new Map();
for (const [file, sym, kind, st, line] of D.defs) {
  push(defsOf, D.symbols[sym], { file, kind, st, line });
  push(defsIn, file, { sym: D.symbols[sym], kind, st, line });
}
for (const [user, definer, flat] of D.edges) {
  const pairs = [];
  for (let i = 0; i < flat.length; i += 2) {
    const name = D.symbols[flat[i]];
    pairs.push({ name, line: flat[i + 1] });
    push(usersOf, name, { user, definer, line: flat[i + 1] });
  }
  push(usesOut, user, { file: definer, pairs });
  push(usesIn, definer, { file: user, pairs });
}
const unsure = new Map();
for (const [kind, why] of [["same_name", "same_name_why"], ["static_only", "static_only_why"]]) {
  for (const row of D.unresolved[kind].shown) unsure.set(row.name, { ...row, why: D.unresolved[why] });
}
const probesIn = new Map(D.probes);
const shownFile = (i) => !S.hidden.has(D.classes.names[D.classes.of[i]]);
const moduleName = (i) => { const g = D.groupings[S.group]; return g.names[g.of[i]]; };
const view = () => D.views[S.group];
const loopModules = () => new Set(view().issues.cycles.shown.flatMap((c) => c.modules.shown));

let memo = { key: null, value: null };
function grouped() {
  const key = S.group + "|" + [...S.hidden].sort().join();
  if (memo.key === key) return memo.value;
  const modules = new Map();
  const module = (name) => {
    if (!modules.has(name)) {
      modules.set(name, { name, files: [], in: 0, out: 0, users: new Set(), used: new Set(), probes: 0 });
    }
    return modules.get(name);
  };
  D.files.forEach((_, i) => {
    if (!shownFile(i)) return;
    const m = module(moduleName(i));
    m.files.push(i);
    m.probes += (probesIn.get(i) || []).length;
  });
  const between = new Map();
  for (const [user, definer, flat] of D.edges) {
    if (!shownFile(user) || !shownFile(definer)) continue;
    const a = moduleName(user), b = moduleName(definer);
    if (a === b) continue;
    const id = a + "\u0000" + b;
    if (!between.has(id)) between.set(id, { a, b, n: 0 });
    between.get(id).n += flat.length / 2;
  }
  for (const { a, b, n } of between.values()) {
    module(a).out += n; module(b).in += n;
    module(a).used.add(b); module(b).users.add(a);
  }
  for (const m of modules.values()) {
    const users = m.users.size, used = m.used.size;
    m.role = !users && !used ? "isolated" : !users ? "start" : !used ? "base" : users >= 3 ? "core" : "middle";
  }
  memo = { key, value: { modules, between: [...between.values()] } };
  return memo.value;
}

// ---- small pieces ----------------------------------------------------------------
function go(kind, value, text) {
  const a = el("a", "go", text !== undefined ? text : kind === "f" ? D.files[value] : value);
  a.href = "#";
  a.addEventListener("click", (ev) => { ev.preventDefault(); pick(kind, value); });
  return a;
}
const fileAt = (i, line) => go("f", i, D.files[i] + (line ? ":" + line : ""));
function opener(i, line) {
  if (!D.root) return [];
  const a = el("a", "open", "open");
  a.href = "vscode://file/" + encodeURI(D.root.replace(/^\//, "") + "/" + D.files[i]) + (line ? ":" + line : "");
  return [a];
}
function list(items, make) {
  const ul = el("ul", "list");
  for (const item of items.slice(0, LIST_MAX)) { const li = el("li"); li.append(...make(item)); ul.append(li); }
  if (items.length > LIST_MAX) ul.append(el("li", "n", "… and " + (items.length - LIST_MAX) + " more"));
  return ul;
}
const head = (box, text, count) => box.append(el("h3", "", count === undefined ? text : text + " (" + count + ")"));
function symbolWords(pairs) {
  const text = pairs.slice(0, 5).map((p) => p.name).join(", ");
  return " " + text + (pairs.length > 5 ? ", +" + (pairs.length - 5) : "");
}
function filesOf(p) {
  if (p.t === "m") { const m = grouped().modules.get(p.v); return m ? m.files : []; }
  if (p.t === "f") return [p.v];
  return (defsOf.get(p.v) || []).filter((d) => !d.st).map((d) => d.file);
}
const pickText = (p) => (p.t === "f" ? D.files[p.v] : p.v);

function reach(p) {
  const starts = filesOf(p), level = new Map(starts.map((f) => [f, 0]));
  const first = (p.t === "s");
  let now = starts;
  for (let depth = 1; now.length; depth++) {
    const next = [];
    for (const f of now) for (const { file, pairs } of usesIn.get(f) || []) {
      if (level.has(file) || !shownFile(file)) continue;
      if (first && depth === 1 && !pairs.some((x) => x.name === p.v)) continue;
      level.set(file, depth);
      next.push(file);
    }
    now = next;
  }
  for (const f of starts) level.delete(f);
  return [...level].sort((x, y) => x[1] - y[1] || (D.files[x[0]] < D.files[y[0]] ? -1 : 1));
}
function way(from, to) {
  const ends = new Set(to), came = new Map(from.map((f) => [f, null]));
  const queue = [...from];
  for (let i = 0; i < queue.length; i++) {
    let f = queue[i];
    if (ends.has(f)) {
      const steps = [];
      while (came.get(f)) { const c = came.get(f); steps.unshift({ from: c.from, to: f, pairs: c.pairs }); f = c.from; }
      return steps;
    }
    for (const { file, pairs } of usesOut.get(f) || []) {
      if (!came.has(file)) { came.set(file, { from: f, pairs }); queue.push(file); }
    }
  }
  return null;
}

// ---- the right side --------------------------------------------------------------
function detailTools(box) {
  const p = S.pick;
  const copy = el("button", "small", "Copy name");
  copy.addEventListener("click", () => { if (navigator.clipboard) navigator.clipboard.writeText(pickText(p)).catch(() => {}); });
  const trace = el("button", "small", "Trace from here");
  trace.addEventListener("click", () => { S.trace = { ...p }; renderDetails(); });
  box.append(copy, " ", trace);
}
function traceSection(box) {
  if (!S.trace) return;
  const p = S.pick, t = S.trace;
  if (t.t === p.t && t.v === p.v) {
    box.append(el("p", "hint", "Now pick what it comes to use, on the map or by searching."));
    return;
  }
  head(box, "Way from " + pickText(t));
  const steps = way(filesOf(t), filesOf(p));
  if (!steps) {
    const back = way(filesOf(p), filesOf(t));
    box.append(el("p", "", "No way found" + (back ? "; the other way round takes " + back.length + " step(s)." : ".")));
    return;
  }
  box.append(list(steps, (s) => [go("f", s.from), " → ", go("f", s.to), el("span", "n", symbolWords(s.pairs))]));
}
function reachSection(box) {
  const rows = reach(S.pick);
  head(box, "A change here can reach", rows.length + " files");
  box.append(list(rows, ([f, depth]) => [el("span", "n", depth + "  "), go("f", f)]));
}
function renderDetails() {
  const box = $("right");
  box.replaceChildren();
  const p = S.pick;
  if (!p) {
    box.append(el("h2", "", "Pick something"), el("p", "hint",
      "Click a module, or find a function, variable or file above. On the right you get who uses it, "
      + "what it uses, where it is defined and what a change can reach."));
    return;
  }
  if (p.t === "m") moduleDetails(box, p.v);
  else if (p.t === "f") fileDetails(box, p.v);
  else symbolDetails(box, p.v);
  writeHash();
}
function moduleDetails(box, name) {
  const { modules, between } = grouped();
  const m = modules.get(name);
  box.append(el("h2", "mono", name));
  detailTools(box);
  if (!m) { box.append(el("p", "hint", "Not in the current filters.")); return; }
  box.append(el("p", "n", ROLE_TAG[m.role] + " · " + m.files.length + " files · " + m.in + " uses in, " + m.out + " out"
    + (loopModules().has(name) ? " · in a cycle" : "")));
  traceSection(box);
  const near = (key, other) => between.filter((e) => e[key] === name).sort((x, y) => y.n - x.n)
    .map((e) => [e[other], e.n]);
  for (const [title, key, other] of [["Used by", "b", "a"], ["Uses", "a", "b"]]) {
    const rows = near(key, other);
    head(box, title, rows.length);
    box.append(list(rows, ([n, count]) => [go("m", n), el("span", "n", "  " + count)]));
  }
  reachSection(box);
  head(box, "Files", m.files.length);
  box.append(list(m.files, (f) => [go("f", f)]));
}
function fileDetails(box, i) {
  box.append(el("h2", "mono", D.files[i]));
  detailTools(box);
  box.append(el("p", "n", D.classes.names[D.classes.of[i]] + " · in "), );
  box.lastChild.append(go("m", moduleName(i)));
  const probes = probesIn.get(i);
  if (probes) box.append(el("p", "n", "Probes: " + probes.map((n) => "#" + n).join(" ")));
  traceSection(box);
  const defs = (defsIn.get(i) || []).slice().sort((a, b) => a.line - b.line);
  head(box, "Defines", defs.length);
  box.append(list(defs, (d) => [go("s", d.sym), el("span", "n", "  :" + d.line + (d.st ? " static" : "")), ...opener(i, d.line)]));
  for (const [title, table] of [["Used by", usesIn], ["Uses", usesOut]]) {
    const rows = (table.get(i) || []).filter((r) => shownFile(r.file));
    head(box, title, rows.length);
    box.append(list(rows, (r) => [go("f", r.file), el("span", "n", symbolWords(r.pairs))]));
  }
  reachSection(box);
}
function symbolDetails(box, name) {
  box.append(el("h2", "mono", name));
  detailTools(box);
  const defs = defsOf.get(name) || [], doubt = unsure.get(name), users = usersOf.get(name) || [];
  const status = doubt ? (doubt.why) : users.length || defs.length === 1 ? "matched by name, one definition fits (likely)" : "";
  if (status) box.append(el("p", doubt ? "warn" : "n", status));
  traceSection(box);
  head(box, "Defined", defs.length);
  box.append(list(defs, (d) => [fileAt(d.file, d.line), el("span", "n", " " + (d.kind === "f" ? "function" : "variable") + (d.st ? " static" : "")), ...opener(d.file, d.line)]));
  if (doubt) {
    head(box, "Named by", doubt.users);
    box.append(list(doubt.used_by, (f) => [fileNo.has(f) ? go("f", fileNo.get(f)) : f]));
    return;
  }
  head(box, "Used by", users.length);
  box.append(list(users, (u) => [fileAt(u.user, u.line), ...opener(u.user, u.line)]));
  box.append(el("p", "hint", "Not seen: " + D.unresolved.not_seen + "."));
  if (filesOf(S.pick).length) reachSection(box);
}

// ---- the left side: lists --------------------------------------------------------
function moduleRows(card, rows, key) {
  card.append(list(rows, (r) => [go("m", r.module), el("span", "n", "  " + r[key])]));
}
function renderStart() {
  const left = $("left"), s = view().summary;
  left.append(el("p", "hint", s.note));
  const cards = el("div", "cards");

}
function showResults() {
  const box = $("results"), found = findAll($("q").value);
  box.replaceChildren();
  hitNames = new Set(found.filter((r) => r.t === "m").map((r) => r.v));
  if (S.tab === "map") schedule();
  if (!$("q").value.trim()) { box.hidden = true; return; }
  box.hidden = false;
  box.append(el("li", "n", found.length + " found"));
  for (const r of found.slice(0, 40)) {
    const li = el("li"), a = el("a");
    a.href = "#";
    a.append(el("span", "k", r.tag), pickText(r));
    a.addEventListener("click", (ev) => { ev.preventDefault(); box.hidden = true; pick(r.t, r.v); });
    a.addEventListener("keydown", (ev) => stepResults(ev, a));
    li.append(a); box.append(li);
  }
}
function stepResults(ev, from) {
  const links = [...$("results").querySelectorAll("a")], i = links.indexOf(from);
  if (ev.key === "ArrowDown") { (links[i + 1] || links[i]).focus(); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { (links[i - 1] || $("q")).focus(); ev.preventDefault(); }
}

// ---- wiring ------------------------------------------------------------------------
function pick(t, v, keepDrawing) {
  S.pick = { t, v };
  if (keepDrawing && S.tab === "map" && S.dir === "all") {
    G.focus = t === "m" ? v : null;
    emphasis();
    schedule();
    renderDetails();
  } else render();
}
function render() {
  const left = $("left");
  left.replaceChildren();
  left.classList.remove("drawing");
  for (const [id] of TABS) $("tab-" + id).setAttribute("aria-selected", String(S.tab === id));
  $("filters").hidden = !["map", "modules"].includes(S.tab);
  $("drawing-options").hidden = S.tab !== "map";
  ({ start: renderStart, map: renderMap, modules: renderModules, problems: renderProblems,
    unresolved: renderUnresolved, changes: renderChanges })[S.tab]();
  renderDetails();
  writeHash();
}
function writeHash() {
  const h = new URLSearchParams();
  if (S.tab !== "start") h.set("tab", S.tab);
  if (S.group !== D.default) h.set("group", S.group);
  if (S.hidden.size) h.set("hide", [...S.hidden].join(","));
  if (S.min > 1) h.set("min", S.min);
  if (S.pick) h.set("pick", S.pick.t + ":" + (S.pick.t === "f" ? D.files[S.pick.v] : S.pick.v));
  const text = h.toString();
  try { history.replaceState(null, "", text ? "#" + text : location.pathname); }
  catch (e) { /* some browsers refuse this for local files */ }
}
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (TABS.some(([id]) => id === h.get("tab"))) S.tab = h.get("tab");
  if (h.has("group") && D.groupings[h.get("group")]) S.group = h.get("group");
  S.hidden = new Set((h.get("hide") || "").split(",").filter(Boolean));
  S.min = Math.max(1, Number(h.get("min")) || 1);
  const p = h.get("pick");
  if (p && p.length > 2) {
    const t = p[0], v = p.slice(2);
    if (t === "f" && fileNo.has(v)) S.pick = { t, v: fileNo.get(v) };
    else if (t === "m" || t === "s") S.pick = { t, v };
  }
}
function applyTheme() {
  if (S.theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = S.theme;
  $("theme").textContent = "Theme: " + S.theme;
}

$("title").textContent = D.name + " — code map";
$("meta").textContent = D.files.length + " source files · counts are (symbol, using file) pairs, a measure of contact, not of importance";
$("limits").textContent = D.limits.join(" · ");
if (D.public) { $("public").hidden = false; $("public").textContent = "Public copy: " + D.public; }
for (const [id, text] of TABS) {
  const b = el("button", "", text);
  b.id = "tab-" + id;
  b.setAttribute("role", "tab");
  b.addEventListener("click", () => { S.tab = id; render(); });
  $("tabs").append(b);
}
const groupLabels = { archive: "archive", output: "final output", directory: "folder" };
const groups = Object.keys(D.groupings);
for (const key of groups) { const o = el("option", "", groupLabels[key]); o.value = key; $("group").append(o); }
$("group-box").hidden = groups.length < 2;
$("group").addEventListener("change", (ev) => { S.group = ev.target.value; S.pick = null; render(); });
readHash();
$("group").value = S.group;
$("min").value = S.min;
$("layout").value = S.layout;
D.classes.names.forEach((name, n) => {
  const count = D.classes.of.filter((c) => c === n).length;
  const box = el("input"), label = el("label", "opt");
  box.type = "checkbox";
  box.checked = !S.hidden.has(name);
  box.addEventListener("change", () => { if (box.checked) S.hidden.delete(name); else S.hidden.add(name); render(); });
  label.append(box, name + " " + count, " ");
  $("classes").append(label, " ");
});
$("min").addEventListener("change", (ev) => { S.min = Math.max(1, Number(ev.target.value) || 1); render(); });
$("dir").addEventListener("change", (ev) => { S.dir = ev.target.value; render(); });
$("depth").addEventListener("change", (ev) => { S.depth = Math.max(0, Number(ev.target.value) || 0); render(); });
$("layout").addEventListener("change", (ev) => { S.layout = ev.target.value; remember(); render(); });
$("fit").addEventListener("click", fit);
$("theme").addEventListener("click", () => {
  const themes = ["auto", "light", "dark", "contrast"];
  S.theme = themes[(themes.indexOf(S.theme) + 1) % themes.length];
  applyTheme(); remember();
  if (S.tab === "map") schedule();
});
let timer = 0;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(showResults, 120); });
$("q").addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown") { const a = $("results").querySelector("a"); if (a) { a.focus(); ev.preventDefault(); } }
  else if (ev.key === "Enter") { const a = $("results").querySelector("a"); if (a) a.click(); }
});
document.addEventListener("keydown", (ev) => {
  const q = $("q");
  const typing = /^(INPUT|SELECT)$/.test(document.activeElement.tagName);
  if (ev.key === "/" && !typing) { ev.preventDefault(); q.focus(); q.select(); }
  else if (ev.key === "Escape") { q.value = ""; showResults(); q.blur(); }
});
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) $("results").hidden = true; });
window.addEventListener("hashchange", () => { readHash(); render(); });
applyTheme();
render();
</script>
